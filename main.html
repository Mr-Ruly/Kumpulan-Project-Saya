<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pribadi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: url('https://i.pinimg.com/474x/dd/09/bd/dd09bd88ca8c02462384b876addb35ac.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            position: relative;
        }
        /* Efek overlay agar teks lebih terbaca */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }
        .profile-container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.1); /* Transparan */
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            backdrop-filter: blur(10px); /* Efek kaca */
            border: 2px solid rgba(255, 255, 255, 0.3); /* Garis tipis */
        }
        .profile-container img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid white;
            margin-bottom: 15px;
        }
        .profile-container h2 {
            margin-bottom: 10px;
        }
        .profile-container p {
            color: #e0e0e0;
            margin-bottom: 10px;
        }
        .profile-container a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #ff7eb3;
            padding: 10px 20px;
            border-radius: 25px;
            transition: 0.3s;
        }
        .profile-container a:hover {
            background: #ff4e90;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <img src="images/profile.jpg" alt="Foto Profil">
        <h2>Ruly Setiaji</h2>
        <p>Saya seorang pekerja keras yang selalu berusaha menyelesaikan tugas dengan cepat dan tepat. Mudah beradaptasi dengan lingkungan baru.</p>
        <p>Email: Rulysaja03@gmail.com</p>
        <p>HandPhone: 0895-2543-9541</p>
        <a href="https://wa.me/6289525439541"target="_blank">Hubungi Saya</a>
    </div>
</body>
</html>
